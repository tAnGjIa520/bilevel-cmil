# proj setting
project: 'CMIL'
exp_name: 'csc_clam_cl'
wandb_mode: 'disabled' # 'online', 'offline', 'disabled'
log_dir: 'logs' # directory for saving logs and checkpoints

# model setting
model: clam_sb # clam_sb, clam_mb
net: 'clam_sb'
D_feat: 512
L: 512
D: 256
K: 1 # clam_sb: 1, clam_mb: n_classes
dropout: True
gate: True
k_sample: 8
subtyping: True
instance_loss_name: 'svm'
bag_weight: 0.7
feature_extractor: null

# dataset setting
dataset: 'csc_cl'
data_root: '/mnt/nfs/zhangjinouwen/tangjia/cmil/bilevel-cmil/data'
feat_dir: 'embeddings'
classes_order: ['2', '4', '0', '5', '3', '1']
n_folds: 1
n_classes: 6
n_tasks: 2 # 2, 3, 5

# train setting
batch_size: 1
weighted_sample: False
n_batches: -1
early_stop: False
patience: 10
opt: adam
lr: [1e-4, 1e-4, 1e-4, 1e-4, 1e-4] # float or list
weight_decay: 0.
seed: 1
epochs: [0, 50, 50] # int or list
# epochs: [1, 1, 1] # int or list
testing: False
load: null
debug: 'False' # False, lite/True (quick check), full (run a few steps)
folds_start: -1
folds_end: -1

# cl setting
cl_method: 'prev' # 'none', 'finetune', 'ewc', 'replay', 'full-replay', 'joint'

buffer_balance: False

buffer_size: 1  # 42
buffer_slide_size: 50 # n_patches in a pseudo slide
#distill_method: 'maxmin' # 'max', 'random', 'maxmin', mix
distill_method: 'kibo'
mix_coarse_ratio: 2.0  # for mix method: coarse selection size = mix_coarse_ratio * final_size
wn: False
cl_on_current: False

# BCSR Coreset hyperparameters (Best configuration - Score: 0.7167)
bcsr_lr_proxy_model: 1.0  # learning rate for proxy model
bcsr_beta: 0.01  # beta parameter
bcsr_max_outer_it: 10  # maximum outer iterations
bcsr_max_inner_it: 1  # maximum inner iterations
bcsr_weight_lr: 0.01  # weight learning rate
distall_lamda: 0.1
topk_method: 'gumbel'  # 'sigmoid', 'gumbel', 'ste'
topk_temperature: 0.5  # temperature for topk selection
normalize_method: 'zscore'  # 'l2', 'softmax', 'zscore', 'none'
use_simplex_projection: False  # whether to project weights onto simplex
distill_target: 'features'  # knowledge distillation target: 'logits', 'features', 'both'




draw_curve : False