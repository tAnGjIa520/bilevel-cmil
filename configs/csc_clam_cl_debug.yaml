# proj setting
project: 'CMIL'
exp_name: 'csc_clam_cl_debug'
wandb_mode: 'disabled' # 'online', 'offline', 'disabled'
log_dir: 'logs' # directory for saving logs and checkpoints

# model setting
model: clam_sb # clam_sb, clam_mb
net: 'clam_sb'
D_feat: 512
L: 512
D: 256
K: 1 # clam_sb: 1, clam_mb: n_classes
dropout: True
gate: True
k_sample: 8
subtyping: True
instance_loss_name: 'svm'
bag_weight: 0.7
feature_extractor: null

# dataset setting
dataset: 'csc_cl'
data_root: '/mnt/nfs/zhangjinouwen/tangjia/cmil/bilevel-cmil/data'
feat_dir: 'embeddings'
classes_order: ['2', '4', '0', '5', '3', '1']
n_folds: 1
n_classes: 6
n_tasks: 3 # 2, 3, 5

# train setting
batch_size: 1
weighted_sample: False
n_batches: 2 # 仅运行2个batch用于快速调试
early_stop: False
patience: 10
opt: adam
lr: [1e-4, 1e-4, 1e-4, 1e-4, 1e-4] # float or list
weight_decay: 0.
seed: 1
epochs: [2, 2, 2] # 减少到2个epoch用于快速调试
testing: False
load: null
debug: 'lite' # 启用lite调试模式
folds_start: -1
folds_end: -1

# cl setting
cl_method: 'prev' # 'none', 'finetune', 'ewc', 'replay', 'full-replay', 'joint'
buffer_size: 3 # 减小buffer大小用于调试
buffer_balance: True
buffer_slide_size: 50 # 减小slide大小用于调试
distill_method: 'mix'
mix_coarse_ratio: 2  # for mix method: coarse selection size = mix_coarse_ratio * final_size
wn: False
cl_on_current: False

# BCSR Coreset hyperparameters
bcsr_lr_proxy_model: 10  # learning rate for proxy model
bcsr_beta: 0.1  # beta parameter
bcsr_max_outer_it: 3  # maximum outer iterations
bcsr_max_inner_it: 1  # maximum inner iterations
bcsr_weight_lr: 10  # weight learning rate
distall_lamda : 0.1
draw_curve : True

# Coreset weight initialization configuration
coreset_weight_init: 'attention_based'    # initialization method: 'uniform_random', 'uniform_equal', 'gaussian', 'attention_based', 'entropy_based', 'hybrid'
init_hyperparams:                         # hyperparameters for initialization method
  # uniform_random parameters
  low: 0.0                                # lower bound of random range
  high: 1.0                               # upper bound of random range

  # uniform_equal parameters
  base_value: null                        # null means 1/n, otherwise use specified value

  # gaussian parameters
  mean: 0.5                               # mean of normal distribution
  std: 0.2                                # std of normal distribution
  activation: 'sigmoid'                   # activation function: 'sigmoid' or 'relu'

  # attention_based parameters
  aggregation: 'mean'                     # aggregation method: 'mean', 'max', 'weighted_mean'
  normalize: True                         # whether to normalize
  temperature: 1.0                        # temperature parameter (larger = smoother)

  # entropy_based parameters
  normalization: 'minmax'                 # normalization method: 'minmax' or 'softmax'
  inverse: True                           # low entropy high weight (True) or high entropy high weight (False)
  eps: 1e-8                               # numerical stability parameter

  # hybrid method parameters
  attention_weight: 0.7                   # attention weight ratio
  entropy_weight: 0.3                     # entropy weight ratio