# =============== PROJECT CONFIGURATION ===============
# 项目基本设置 - DEBUG版本
project: 'CMIL'  # 项目名称，用于Weights & Biases (wandb) 项目命名
exp_name: 'csc_clam_cl_debug'  # 实验名称，专门用于调试
wandb_mode: 'disabled'  # Weights & Biases 记录模式：调试时建议禁用

# =============== MODEL CONFIGURATION ===============
# CLAM模型架构配置
model: clam_sb  # 模型类型：clam_sb (单分支) 或 clam_mb (多分支)
net: 'clam_sb'  # 网络架构名称，与model保持一致
D_feat: 512  # 输入特征维度，即从特征提取器得到的特征向量维度
L: 512  # 注意力网络中的隐藏层维度
D: 256  # 注意力网络中的第二隐藏层维度
K: 1  # 注意力头数：clam_sb固定为1，clam_mb为类别数
dropout: True  # 是否在注意力网络中使用dropout (p=0.25)
gate: True  # 是否使用门控注意力机制 (sigmoid gating)
k_sample: 8  # 实例级训练时采样的正负样本patch数量
subtyping: True  # 是否为子类型分类任务 (影响实例级损失的计算方式)
instance_loss_name: 'svm'  # 实例级损失函数：'cross_entropy' 或 'svm' (SmoothTop1SVM)
bag_weight: 0.7  # 袋级损失与实例级损失的权重平衡：bag_loss*0.7 + instance_loss*0.3
feature_extractor: null  # 特征提取器，null表示使用预提取的特征

# =============== DATASET CONFIGURATION ===============
# 数据集配置
dataset: 'csc_cl'  # 数据集名称，csc_cl表示CSC数据集的连续学习版本
data_root: '/root/cmil/MICIL-main/local_data'  # 数据根目录路径
feat_dir: 'embeddings'  # 特征文件存储的子目录名称
classes_order: ['2', '4', '0', '5', '3', '1']  # 连续学习中类别出现的顺序
n_folds: 1  # 交叉验证的折数
n_classes: 6  # 总类别数
n_tasks: 2  # 连续学习任务数：可选2、3、5

# =============== TRAINING CONFIGURATION ===============
# 训练参数配置 - DEBUG优化版本
batch_size: 1  # 批大小，MIL通常使用1 (每个batch包含一个bag)
weighted_sample: False  # 是否使用加权采样来平衡类别
n_batches: 5  # 每个epoch的batch数，调试时限制为5个batch快速验证
early_stop: False  # 调试时关闭早停，确保完整运行
patience: 10  # 早停耐心值，连续多少个epoch无改善后停止
opt: adam  # 优化器类型
lr: [1e-3, 1e-3, 1e-3, 1e-3, 1e-3]  # 调试时使用较大学习率加快收敛
weight_decay: 0.  # L2正则化权重衰减
seed: 1  # 随机种子，用于结果复现
epochs: [2, 2, 2]  # 调试时每个任务只训练2轮，快速验证流程
testing: False  # 是否为测试模式
load: null  # 预训练模型路径，null表示从头训练
debug: 'lite'  # 调试模式：设置为'lite'进行快速检查
folds_start: -1  # 开始的fold索引，-1表示从头开始
folds_end: -1  # 结束的fold索引，-1表示到最后

# =============== CONTINUAL LEARNING CONFIGURATION ===============
# 连续学习方法配置 - DEBUG简化版本
cl_method: 'LwF'  # 连续学习方法：调试时使用'none'简化流程
buffer_size: 10  # 经验重放缓冲区大小，调试时使用小缓冲区
buffer_balance: False  # 缓冲区是否保持类别平衡
buffer_slide_size: 50  # 伪滑片中的patch数量，调试时减少数量
distill_method: 'random'  # 特征蒸馏方法：调试时使用简单的随机采样
wn: False  # 是否对全连接层权重进行归一化
cl_on_current: False  # 是否在当前任务数据上应用连续学习方法

# =============== DEBUG SPECIFIC NOTES ===============
# 调试专用说明：
# 1. n_batches=5: 每个epoch只处理5个batch，快速验证代码逻辑
# 2. epochs=[2,2,2]: 每个连续学习任务只训练2轮
# 3. lr提高到1e-3: 加快收敛速度，便于观察训练过程
# 4. debug='lite': 启用轻量级调试模式
# 5. buffer_size=10: 小缓冲区减少内存占用
# 6. buffer_slide_size=50: 减少特征蒸馏的计算量